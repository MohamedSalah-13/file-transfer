name: Packages (Linux, macOS)

# jpackage only builds for the system it runs on, so the Linux and macOS packages are made here.
# The Windows installer is still built and published from the developer's computer by
# packaging/release.ps1; publishing that release starts this workflow, which adds its files to the
# same release. Installed copies keep finding releases by their Windows installer (client.Updates);
# on Linux and macOS the updater offers the release's page, where these files are.
on:
  release:
    types: [published]
  # A change to the packaging is tried out before it is merged; the packages are kept as artifacts.
  pull_request:
    paths:
      - packaging/**
      - pom.xml
      - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and add the packages to (empty builds this branch, artifacts only)
        required: false
        default: ''

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    # The jobs are desktop-updater's shared ones: package.ps1 on Linux and on both kinds of Mac.
    # Pinned to a commit, so nothing changes here without a pull request in this repository.
    uses: MohamedSalah-13/desktop-updater/.github/workflows/package-unix.yml@12790947000d45c2d097790c3af2607a56a9550a
    permissions:
      contents: write # adds the packages to the release
    with:
      script: packaging/package.ps1
      files: target/installer/FileTransfer*
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      # fakeroot for the .deb; a virtual screen and GTK for ClientConnectionTest, which starts JavaFX.
      apt-packages: fakeroot xvfb libgtk-3-0
      virtual-screen: true
      test-reports: target/surefire-reports
      artifact-name: packages
