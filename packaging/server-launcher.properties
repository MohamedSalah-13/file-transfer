# Second launcher in the installer: "File Transfer Server" (see package.ps1).
module=com.hamza.filetransfer/com.hamza.filetransfer.server.ServerLauncher
# Keeps the server's data in ~/.file-transfer/server instead of the install folder (ServerConfig.workDir).
java-options=-Dfiletransfer.packaged=true
# The client icon with a server badge (made by IconMaker.java).
icon=packaging/server.ico
win-menu=true
win-shortcut=true
